[pytest]
pythonpath = .
testpaths = tests
# langsmith is a transitive dependency of langchain and its pytest plugin
# imports the full tracing SDK during collection; PyRAG-Kit does not use it.
addopts = -p no:langsmith
# 忽略第三方库的 DeprecationWarning 和 UserWarning
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
