[pytest]
pythonpath = .
testpaths = tests
# langsmith is a transitive dependency of langchain and its pytest plugin
# imports the full tracing SDK during collection; PyRAG-Kit does not use it.
addopts = -p no:langsmith
# 只忽略第三方依赖的噪音；本仓库代码产生的警告必须可见。
#
# 原先这里是全局 ``ignore::UserWarning`` / ``ignore::DeprecationWarning``，
# 等于把四个快速迭代的 SDK（openai / google-genai / anthropic / openpyxl）的
# 升级警告和本项目自身的警告一起静音了——实测同一个探针用例在全局忽略下静默
# 通过、在 ``-W error::UserWarning`` 下失败，说明警告确实发生却被吞掉。
filterwarnings =
    default::DeprecationWarning
    default::UserWarning
    # 第三方依赖的已知噪音：按 module 前缀限定，不用全局忽略。
    ignore::DeprecationWarning:pydantic.*
    ignore::DeprecationWarning:pydantic_settings.*
    ignore::DeprecationWarning:langchain.*
    ignore::DeprecationWarning:langchain_core.*
    ignore::DeprecationWarning:langchain_text_splitters.*
    ignore::DeprecationWarning:google.*
    ignore::DeprecationWarning:openai.*
    ignore::DeprecationWarning:anthropic.*
    ignore::DeprecationWarning:jieba.*
    ignore::DeprecationWarning:rank_bm25.*
    ignore::UserWarning:jieba.*
    ignore::UserWarning:rank_bm25.*
