name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "要发布的版本号，例如 1.3.0"
        required: true
      tag:
        description: "目标标签，例如 v1.3.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: windows-x64
          - runner: macos-15-intel
            target: macos-x64
          - runner: macos-15
            target: macos-arm64
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.6.0

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Build binary bundle
        run: uv run python scripts/build_binary_release.py --target "${{ matrix.target }}" --validate

      - name: Upload release artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: ${{ matrix.target }}
          path: |
            release_artifacts/*.zip
            release_artifacts/*.tar.gz
          if-no-files-found: error

  test:
    # 发布流程此前从不跑测试：打标签的提交若没走过 PR 门禁，产物会在测试全红
    # 的情况下被发出去。刻意用单独的 job 而不是塞进 build：build 是五平台矩阵，
    # 其中四个平台（Windows 与 macOS/linux arm64）本仓库从未在 CI 上跑过测试，
    # 拿它们当发布门禁等于用一个没人验证过的信号去拦发布。这里固定在
    # ubuntu-24.04——与 quality.yml 同一环境，覆盖已验证的路径。
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v7.6.0

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest -q

  publish:
    needs: [build, test]
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: release_artifacts

      - name: Setup Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11"

      - name: Resolve version metadata
        id: release_meta
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "${GITHUB_OUTPUT}"
            echo "version=${{ github.event.inputs.version }}" >> "${GITHUB_OUTPUT}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
            echo "version=${version}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Validate version metadata
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release_meta.outputs.tag }}"
          version="${{ steps.release_meta.outputs.version }}"

          # 手动 workflow_dispatch 的 tag/version 是手填的，必须与仓库中的
          # 唯一真源交叉校验：否则会发出一个版本号与产物/说明不符的 release。
          pyproject_version="$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          if [ "${version}" != "${pyproject_version}" ]; then
            echo "版本不匹配: 输入 ${version} vs pyproject.toml ${pyproject_version}" >&2
            exit 1
          fi

          expected_tag="v${pyproject_version}"
          if [ "${tag}" != "${expected_tag}" ]; then
            echo "标签不匹配: 输入 ${tag} vs 期望 ${expected_tag}" >&2
            exit 1
          fi

          # CHANGELOG 必须已有该版本条目（extract_release_notes 也会检查，
          # 但在这里提前失败能给出更清楚的错误位置）。
          if ! grep -q "^## \[${pyproject_version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md 中未找到版本 ${pyproject_version} 的条目。" >&2
            exit 1
          fi

      - name: Extract release notes
        run: python scripts/extract_release_notes.py --version "${{ steps.release_meta.outputs.version }}" --output RELEASE_NOTES.md

      - name: Verify archive contents
        shell: bash
        run: |
          set -euo pipefail
          # 发布包必须自证两件事，否则坏包会直接流到用户手里：
          #   1) 不含凭证文件（.env / config.toml）——它们由用户从示例复制，
          #      打进包里等于把某台机器的配置发给所有人；
          #   2) 含离线分词兜底（tiktoken_cache）——缺失时首次构建知识库
          #      会在无网环境下失败，而构建期的 --validate 有网、看不出来。
          # download-artifact 把每个 artifact 解到 release_artifacts/<name>/，
          # 所以归档在下一层，必须用 find 递归（与 publish 步骤的 maxdepth 2 一致）。
          # 用 glob 会一个都匹配不到，循环体不执行、fail 保持 0，整步静默通过。
          archives=()
          while IFS= read -r archive; do
            archives+=("${archive}")
          done < <(find release_artifacts -maxdepth 2 -type f \
            \( -name "PyRAG-Kit-*.tar.gz" -o -name "PyRAG-Kit-*.zip" \) | sort)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "未找到任何归档，无法校验（下载步骤是否失败？）。" >&2
            exit 1
          fi

          fail=0
          for archive in "${archives[@]}"; do
            echo "== ${archive}"
            if [[ "${archive}" == *.zip ]]; then
              listing="$(python -c "import sys,zipfile;print('\n'.join(zipfile.ZipFile(sys.argv[1]).namelist()))" "${archive}")"
            else
              listing="$(tar -tzf "${archive}")"
            fi

            # 判据必须写成 `grep -E ... >/dev/null`，**不能**用 `grep -q`。
            # `grep -q` 命中即退出，上游 `printf` 收到 SIGPIPE 后以 141 退出；
            # `set -o pipefail` 让整条管道返回 141，而 `if` 只把 0 当成功——
            # 于是「命中」被判成「未命中」。触发条件是归档列表超过管道缓冲区
            # （Linux 上 64 KiB）：实测真实 v1.4.0 产物的列表已是 75–79 KB，
            # 也就是这条检查自发布起就一直是失效的。
            #
            # 两个方向都会给出与事实相反的结论：凭证检查静默跳过（含 `.env`
            # 的包被放行发布），tiktoken_cache 检查误报缺失（正常包被拦下）。
            # `>/dev/null` 让 grep 读完整个输入，不产生 SIGPIPE。
            if grep -E '/(\.env|config\.toml)$' >/dev/null <<<"${listing}"; then
              echo "  ✗ 归档内含凭证文件" >&2
              grep -E '/(\.env|config\.toml)$' >&2 <<<"${listing}"
              fail=1
            fi
            if ! grep -F '/tiktoken_cache/' >/dev/null <<<"${listing}"; then
              echo "  ✗ 归档内缺少 tiktoken_cache（离线分词兜底）" >&2
              fail=1
            fi
          done

          if [ "${fail}" -ne 0 ]; then
            exit 1
          fi
          echo "归档校验通过（${#archives[@]} 个）。"

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          # 只对归档取校验和，便于用户核对下载内容与发布产物一致。
          # 输出用 basename：download-artifact 会多一层 <artifact-name>/ 目录，
          # 带上它会让用户拿单个下载文件对不上号。sha256sum 是 coreutils 标配，
          # shasum 只在装了 perl 的机器上有，所以优先前者。
          if command -v sha256sum >/dev/null 2>&1; then
            hash_cmd=(sha256sum)
          else
            hash_cmd=(shasum -a 256)
          fi

          # 落在 release_artifacts/ 内：publish 步骤按该前缀查找待上传文件，
          # 写到工作区根目录的话这个文件不会随 release 一起发布。
          sums=release_artifacts/SHA256SUMS.txt
          : > "${sums}"
          while IFS= read -r archive; do
            "${hash_cmd[@]}" "${archive}" | sed "s|\([^ ]*\)  .*/|\1  |" >> "${sums}"
          done < <(find release_artifacts -maxdepth 2 -type f \
            \( -name "PyRAG-Kit-*.zip" -o -name "PyRAG-Kit-*.tar.gz" \) | sort)

          if [ ! -s "${sums}" ]; then
            echo "未找到任何归档，无法生成校验和。" >&2
            exit 1
          fi
          cat "${sums}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          files=()
          while IFS= read -r file; do
            files+=("${file}")
          done < <(find release_artifacts -maxdepth 2 -type f \
            \( -name "PyRAG-Kit-*.zip" -o -name "PyRAG-Kit-*.tar.gz" -o -name "SHA256SUMS.txt" \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "未找到发布产物。" >&2
            exit 1
          fi

          if gh release view "${{ steps.release_meta.outputs.tag }}" >/dev/null 2>&1; then
            gh release upload "${{ steps.release_meta.outputs.tag }}" "${files[@]}" --clobber
          else
            gh release create "${{ steps.release_meta.outputs.tag }}" "${files[@]}" \
              --title "${{ steps.release_meta.outputs.tag }}" \
              --notes-file RELEASE_NOTES.md
          fi
