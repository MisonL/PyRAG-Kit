[project]
name = "pyrag-kit"
version = "1.4.0"
description = "A lightweight Python implementation of Dify core RAG logic"
readme = "README.md"
authors = [{ name = "Mison", email = "1360962086@qq.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.4.0",
    "faiss-cpu>=1.15.0",
    "google-genai>=2.22.0",
    "httpx>=0.28.1",
    "jieba>=0.42.1",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.2",
    "langchain-text-splitters>=1.1.2",
    "numpy>=2.4.6",
    "openai>=3.10.0",
    "openpyxl>=3.1.5",
    "prompt-toolkit>=3.0.53",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyfiglet>=1.0.4",
    "questionary>=2.1.1",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "volcengine-python-sdk[ark]>=5.0.48",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.3.1",
    "pyinstaller>=6.22.2",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
# 代码按约 100 列书写；88 列会让大量既有行被无意义折行。
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
# Provider and configuration boundaries intentionally expose ValueError for
# malformed values as part of the existing public contract.
ignore = ["TRY004"]

[tool.mypy]
# jieba does not publish typing metadata; the application boundary keeps its
# use isolated in main.py, so missing third-party stubs should not hide errors
# in the repository's own modules.
[[tool.mypy.overrides]]
module = ["jieba", "jieba.posseg"]
ignore_missing_imports = true
